name: Validate

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Source / Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.18.0'
            react: '18.3.1'
            artifacts: false
          - node: '24.15.0'
            react: '19.2.8'
            artifacts: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Install React 18 for source compatibility tests
        if: matrix.react == '18.3.1'
        run: npm install --no-save --package-lock=false --ignore-scripts react@18.3.1 react-dom@18.3.1
      - run: npm test
      - run: npm run build
      - name: Build and verify committed Pages output
        if: matrix.artifacts
        run: |
          npm run build:page
          npm run check:page
      - run: npm audit --audit-level=low
        if: matrix.artifacts
      - run: npm run package:pack
        if: matrix.artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.artifacts
        with:
          name: npm-package
          path: .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: matrix.artifacts && github.ref == 'refs/heads/main'
        with:
          path: page

  consumers:
    name: Package / Node ${{ matrix.node }} / React ${{ matrix.react }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.15.0']
        react: ['18.3.1', '19.2.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .artifacts
      - run: node scripts/verify-package.mjs --tarball .artifacts/*.tgz --react "${{ matrix.react }}"

  required:
    name: Required checks
    if: always()
    needs: [checks, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          SOURCE_RESULT: ${{ needs.checks.result }}
          CONSUMER_RESULT: ${{ needs.consumers.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$CONSUMER_RESULT" = success
