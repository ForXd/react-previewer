name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:page
      - run: npm run test:package
      - run: npm audit --audit-level=low
      - name: Verify React 18 consumers
        run: |
          npm install --no-save --package-lock=false react@18.3.1 react-dom@18.3.1
          npm test
          npm run test:package
